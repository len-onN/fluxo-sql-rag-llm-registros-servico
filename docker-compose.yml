services:
  aplicacao:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-autogen-aplicacao
    ports:
      - "8080:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BANCO_SQLITE: /dados/registros.db
      DIRETORIO_CHROMA: /dados/chroma
      PROVEDOR_CHAT: lm_studio
      PROVEDOR_EMBEDDINGS: lm_studio
      LM_STUDIO_BASE_URL: http://host.docker.internal:1234/v1
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: https://api.openai.com/v1
      MODELO_CHAT: ""
      MODELO_EMBEDDING: text-embedding-nomic-embed-text-v1.5
      LIMITE_CONTEXTO: 3
      MAX_TOKENS_RESPOSTA: 900
    volumes:
      - ./dados:/dados
      - ./frontend:/app/frontend:ro
